databaseChangeLog:
        - changeSet:
            id: create-notification_task-table
            author: Mari Vasechko
            changes:
              - createTable:
                  tableName: notification_task
                  columns:
                    - column:
                        name: id
                        type: BIGINT
                        autoIncrement: true
                        constraints:
                          primaryKey: true
                          nullable: false
                    - column:
                        name: chat_id
                        type: BIGINT
                        constraints:
                          nullable: false
                    - column:
                        name: message_text
                        type: VARCHAR(255)
                        constraints:
                          nullable: false
                    - column:
                        name: notify_time
                        type: TIMESTAMP
                        constraints:
                          nullable: false
                    - column:
                        name: status
                        type: VARCHAR(20)
                        defaultValue: pending